name: Run Funding Bot

on:
  schedule:
    - cron: '0 */8 * * *'  # Hər 8 saatda bir avtomatik işləyir
  workflow_dispatch: # İstədiyin vaxt əllə işə salmaq üçün

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        run: |
          python bot.py
