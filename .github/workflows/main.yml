name: Phemex Trend Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # Hər 5 dəqiqədən bir avtomatik işləyir
  workflow_dispatch:        # Əllə işə salmaq üçün

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Code Check
        uses: actions/checkout@v3

      - name: Python Setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas pandas-ta

      - name: Run Bot
        env:
          PHEMEX_API_KEY: ${{ secrets.PHEMEX_API_KEY }}
          PHEMEX_SECRET_KEY: ${{ secrets.PHEMEX_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
